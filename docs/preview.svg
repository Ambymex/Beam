<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="8" y="8" width="374" height="784" rx="34"/></clipPath>
  </defs>

  <!-- phone frame -->
  <rect x="0" y="0" width="390" height="800" rx="42" fill="#06100e"/>
  <rect x="8" y="8" width="374" height="784" rx="34" fill="#0f1f1d"/>

  <g clip-path="url(#screen)">
    <!-- top bar -->
    <text x="34" y="52" fill="#e6f4f0" font-size="22">&#8249;</text>
    <text x="195" y="48" fill="#e6f4f0" font-size="18" font-weight="700" text-anchor="middle">Today</text>
    <text x="195" y="64" fill="#8fb3aa" font-size="11" text-anchor="middle">2026-05-29</text>
    <text x="320" y="52" fill="#e6f4f0" font-size="22">&#8250;</text>
    <rect x="338" y="34" width="34" height="34" rx="10" fill="#173430"/>
    <text x="355" y="56" fill="#e6f4f0" font-size="17" text-anchor="middle">&#9881;</text>

    <!-- net carb ring -->
    <g transform="translate(195,205)">
      <circle r="78" fill="none" stroke="#20413b" stroke-width="16"/>
      <circle r="78" fill="none" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round"
              stroke-dasharray="172 318" transform="rotate(-90)"/>
      <text x="0" y="6" fill="#e6f4f0" font-size="56" font-weight="800" text-anchor="middle">7</text>
      <text x="0" y="30" fill="#8fb3aa" font-size="12" letter-spacing="1" text-anchor="middle">NET CARBS</text>
      <text x="0" y="58" fill="#86efac" font-size="15" font-weight="700" text-anchor="middle">13g left</text>
    </g>
    <text x="195" y="312" fill="#8fb3aa" font-size="12" text-anchor="middle">13g of your 20g budget left.</text>

    <!-- streak -->
    <text x="120" y="340" fill="#e6f4f0" font-size="13" font-weight="600" text-anchor="middle">&#10024; 4 days within budget</text>
    <text x="210" y="340" fill="#8fb3aa" font-size="12" text-anchor="middle">best 9</text>
    <g transform="translate(250,336)">
      <circle cx="0" cy="0" r="4.5" fill="#86efac"/><circle cx="13" cy="0" r="4.5" fill="#fbbf24"/>
      <circle cx="26" cy="0" r="4.5" fill="#86efac"/><circle cx="39" cy="0" r="4.5" fill="#86efac"/>
      <circle cx="52" cy="0" r="4.5" fill="#86efac"/><circle cx="65" cy="0" r="4.5" fill="#244a43"/>
      <circle cx="78" cy="0" r="4.5" fill="#86efac"/>
    </g>

    <!-- macros -->
    <g transform="translate(20,356)">
      <rect width="83" height="58" rx="14" fill="#173430"/>
      <rect x="89" width="83" height="58" rx="14" fill="#173430"/>
      <rect x="178" width="83" height="58" rx="14" fill="#173430"/>
      <rect x="267" width="83" height="58" rx="14" fill="#173430"/>
      <text x="41" y="30" fill="#e6f4f0" font-size="18" font-weight="700" text-anchor="middle">32g</text>
      <text x="130" y="30" fill="#e6f4f0" font-size="18" font-weight="700" text-anchor="middle">41g</text>
      <text x="219" y="30" fill="#e6f4f0" font-size="18" font-weight="700" text-anchor="middle">540</text>
      <text x="308" y="30" fill="#e6f4f0" font-size="18" font-weight="700" text-anchor="middle">9g</text>
      <text x="41" y="46" fill="#8fb3aa" font-size="10" text-anchor="middle">PROTEIN</text>
      <text x="130" y="46" fill="#8fb3aa" font-size="10" text-anchor="middle">FAT</text>
      <text x="219" y="46" fill="#8fb3aa" font-size="10" text-anchor="middle">KCAL</text>
      <text x="308" y="46" fill="#8fb3aa" font-size="10" text-anchor="middle">FIBER</text>
    </g>

    <!-- quick-add chips -->
    <g transform="translate(20,428)">
      <rect width="150" height="42" rx="12" fill="#1d403a" stroke="#2dd4bf"/>
      <text x="14" y="19" fill="#2dd4bf" font-size="12" font-weight="600">&#127869; Usual breakfast</text>
      <text x="14" y="33" fill="#2dd4bf" font-size="10">3 items &#183; 2.4g</text>
      <text x="132" y="27" fill="#8fb3aa" font-size="15" text-anchor="middle">&#215;</text>

      <rect x="158" width="96" height="42" rx="12" fill="#173430" stroke="#33bb55"/>
      <text x="170" y="19" fill="#e6f4f0" font-size="12" font-weight="600">Eggs</text>
      <text x="170" y="33" fill="#2dd4bf" font-size="11" font-weight="700">0.8g</text>
      <text x="240" y="27" fill="#86efac" font-size="13" text-anchor="middle">&#9733;</text>

      <rect x="262" width="100" height="42" rx="12" fill="#173430" stroke="#244a43"/>
      <text x="274" y="19" fill="#e6f4f0" font-size="12" font-weight="600">Coffee</text>
      <text x="274" y="33" fill="#2dd4bf" font-size="11" font-weight="700">0g</text>
      <text x="348" y="27" fill="#8fb3aa" font-size="13" text-anchor="middle">&#9734;</text>
    </g>

    <!-- glucose response card -->
    <g transform="translate(20,486)">
      <rect width="350" height="166" rx="18" fill="#173430"/>
      <text x="16" y="28" fill="#e6f4f0" font-size="15" font-weight="700">Glucose response</text>
      <text x="334" y="28" fill="#2dd4bf" font-size="13" font-weight="700" text-anchor="end">Spikers &#9656;</text>

      <!-- TIR -->
      <text x="16" y="56" fill="#86efac" font-size="20" font-weight="800">92%</text>
      <text x="58" y="56" fill="#8fb3aa" font-size="12">in range &#183; avg 5.4 mmol/L</text>
      <rect x="16" y="64" width="318" height="8" rx="4" fill="#244a43"/>
      <rect x="16" y="64" width="14" height="8" rx="4" fill="#f87171"/>
      <rect x="30" y="64" width="293" height="8" fill="#86efac"/>
      <rect x="320" y="64" width="14" height="8" rx="4" fill="#fbbf24"/>

      <!-- mini chart -->
      <rect x="16" y="84" width="318" height="44" fill="#15302c"/>
      <rect x="16" y="98" width="318" height="20" fill="#0e2a2622"/>
      <polyline points="16,114 60,112 104,108 150,96 196,100 244,118 290,110 334,112"
                fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <line x1="150" y1="84" x2="150" y2="128" stroke="#8fb3aa" stroke-dasharray="2 2" opacity="0.5"/>
      <circle cx="150" cy="84" r="3" fill="#e6f4f0"/>

      <!-- event row -->
      <line x1="16" y1="138" x2="334" y2="138" stroke="#244a43"/>
      <text x="16" y="156" fill="#e6f4f0" font-size="13" font-weight="600">Breakfast &#183; 8:05</text>
      <text x="220" y="156" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="end">&#9650; +1.4</text>
      <text x="334" y="156" fill="#8fb3aa" font-size="12" text-anchor="end">2.6g net</text>
    </g>

    <!-- log -->
    <text x="20" y="688" fill="#e6f4f0" font-size="15" font-weight="700">Today's log</text>
    <rect x="296" y="674" width="74" height="26" rx="9" fill="#2dd4bf"/>
    <text x="333" y="691" fill="#06201c" font-size="12" font-weight="700" text-anchor="middle">+ Add food</text>

    <text x="22" y="714" fill="#8fb3aa" font-size="11" letter-spacing="1">BREAKFAST &#183; 2.6G NET</text>
    <g transform="translate(20,722)">
      <rect width="350" height="52" rx="14" fill="#173430"/>
      <text x="14" y="24" fill="#e6f4f0" font-size="14" font-weight="600">Avocado</text>
      <text x="14" y="40" fill="#8fb3aa" font-size="11">1/2 (100g)</text>
      <rect x="92" y="30" width="86" height="15" rx="7" fill="#3a1414"/>
      <text x="135" y="41" fill="#f87171" font-size="9" text-anchor="middle">&#129516; high histamine</text>
      <text x="316" y="32" fill="#2dd4bf" font-size="16" font-weight="800" text-anchor="end">1.8g</text>
    </g>
  </g>
</svg>
